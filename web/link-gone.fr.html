<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lien déjà utilisé ou expiré</title>
<style>
html { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0f0e16;
  color: #e6e6e6;
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif;
}
main {
  box-sizing: border-box;
  width: min(520px, calc(100% - 32px));
  margin: 24px 16px;
  padding: 44px 40px 36px;
  text-align: center;
  background: #16141f;
  border: 1px solid #2b2838;
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
}
svg { display: block; margin: 0 auto 26px; }
h1 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.3; }
p { margin: 8px 0 0; color: #8a8499; font-size: 15px; }
.line {
  width: 56px;
  height: 3px;
  margin: 24px auto 0;
  border-radius: 2px;
  background: linear-gradient(90deg, #af00af, #ff5fff);
}
@media (max-width: 480px) { main { padding: 36px 22px 30px; } }
</style>
</head>
<body>
<main>
<svg width="112" height="72" viewBox="0 6 28 18" aria-hidden="true">
<rect x="1" y="7" width="26" height="16" rx="3" fill="none" stroke="#ffd75f" stroke-width="2"/>
<circle cx="8" cy="15" r="2.6" fill="#ffd75f"/>
<circle cx="20" cy="15" r="2.6" fill="#ffd75f"/>
<path d="M11.5 15h5" stroke="#ffd75f" stroke-width="2" stroke-dasharray="2 2"/>
</svg>
<h1>Lien déjà utilisé ou expiré</h1>
<p>Un lien de téléchargement ne marche qu'une fois, pendant 10&nbsp;minutes. Demandez-en un nouveau.</p>
<div class="line"></div>
</main>
</body>
</html>
